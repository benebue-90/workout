<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#ECEEE8" />
<title>Terrace Kettlebell Workout</title>
<style>
  :root{
    --bg:#ECEEE8;
    --panel:#FFFFFF;
    --ink:#1C1F1D;
    --muted:#6B6F68;
    --line:#D8D3C4;
    --work:#B23A20;
    --trans:#B8892B;
    --rest:#3B6E71;
    --accent:#B8892B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);}
  .brand{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted);
    padding:10px 16px 6px;}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;}
  .tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  main{flex:1;padding:16px 16px 40px;}
  h1{font-size:clamp(22px,7vw,28px);font-weight:800;margin:4px 0 2px;text-transform:uppercase;letter-spacing:.01em;}
  .subtitle{color:var(--muted);font-weight:600;margin:0 0 14px;font-size:14px;}
  .info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    margin-bottom:10px;font-size:14px;font-weight:600;color:var(--muted);}
  .info b{color:var(--ink);}
  .tip{font-size:12px;color:var(--muted);font-style:italic;margin:0 0 14px;}
  .now{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
    margin-bottom:18px;text-align:center;transition:border-color .15s ease;}
  .now.phase-work{border-color:var(--work);}
  .now.phase-transition{border-color:var(--trans);}
  .now.phase-rest{border-color:var(--rest);}
  .now-label{font-size:clamp(17px,6vw,21px);font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
  .now-time{font-size:clamp(42px,16vw,64px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:4px 0;}
  .now.phase-work .now-time{color:var(--work);}
  .now.phase-transition .now-time{color:var(--trans);}
  .now.phase-rest .now-time{color:var(--rest);}
  .now-sub{color:var(--muted);font-weight:600;font-size:14px;min-height:18px;}
  .dots{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:transparent;
    transition:background-color .15s ease,border-color .15s ease;}
  .dot.filled{background:var(--accent);border-color:var(--accent);}
  .dot.active{border-color:var(--work);}
  .controls{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-weight:800;font-size:14px;
    text-transform:uppercase;letter-spacing:.03em;min-height:44px;}
  .btn-primary{background:var(--ink);color:var(--bg);}
  .btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.4;}
  .exlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .exitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .exitem.current{border-color:var(--work);box-shadow:0 0 0 1px var(--work) inset;}
  .checkline{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .checkline input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--ink);}
  .exname{font-weight:700;font-size:16px;}
  input:checked + .exname{opacity:.45;text-decoration:line-through;}
  .exsub{color:var(--muted);font-size:13px;margin:4px 0;font-weight:600;}
  .checklist .exsub{margin-left:30px;}
  .cue summary{color:var(--rest);font-weight:700;font-size:12px;text-transform:uppercase;
    letter-spacing:.04em;cursor:pointer;list-style:none;}
  .cue summary::-webkit-details-marker{display:none;}
  .cue p{margin:6px 0 0;font-size:14px;color:var(--ink);}
  .checklist .cue{margin-left:30px;}
  .seqlist{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px;}
  .seqitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
    display:flex;align-items:baseline;gap:8px;font-size:14px;}
  .seqnum{font-weight:800;color:var(--accent);flex:0 0 auto;}
  .stretch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .timer-chip{font-variant-numeric:tabular-nums;font-weight:800;min-width:44px;text-align:right;font-size:14px;}
  footer.note{padding:10px 16px calc(20px + env(safe-area-inset-bottom));color:var(--muted);
    font-size:12px;text-align:center;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Terrace KB Program</div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="content"></main>
  <footer class="note">Turn Silent Mode off for beeps. Vibration works either way.</footer>
</div>

<script>
  // ---------- Config ----------
  var TRANSITION = 10;   // seconds between exercises in continuous mode
  var ROUND_REST = 60;   // seconds rest at the end of a continuous round

  // ---------- Data ----------
  var DAYS = [
    { id:'warmup', type:'list', title:'Warm-up', subtitle:'~4 min, every session', items:[
      { name:'Arm circles', sub:'20 sec each direction', cue:'Small circles, gradually bigger, then reverse direction.' },
      { name:'Kettlebell halos', sub:'8 kg — 10 each way', cue:'Hold the horns at chest height, circle it around your head, brace your core.' },
      { name:'Bodyweight squats', sub:'15 reps', cue:'Hips back, chest up, drive through your heels.' },
      { name:'Inchworm walkout', sub:'8 reps (alt: Cat-Cow, 10 reps)', cue:'Hinge, walk your hands out to a plank, walk back, stand up.' },
      { name:'Shoulder pass-throughs', sub:'10 reps', cue:'Swing straight arms up and back overhead in a wide arc.' }
    ]},

    { id:'day1', type:'circuit', title:'Day 1', subtitle:'Push Power + Cardio', rounds:4, work:40, rest:20,
      items:[
        { name:'Goblet push press', sub:'12 kg — 12 reps', cue:'Dip your knees, drive up through your legs, press the bell overhead.' },
        { name:'Push-ups', sub:'15 reps', cue:'Straight line head to heels, elbows about 45\u00B0 from your body.' },
        { name:'KB swings', sub:'12 kg \u2014 20 reps \u00B7 cardio', cue:'Hip hinge and snap \u2014 not a squat. Let the bell float, don\u2019t lift it with your arms.' },
        { name:'Floor press, alternating', sub:'12 kg — 8/side', cue:'Lying on your back, press one arm up, lower with control, switch.' },
        { name:'Goblet squat', sub:'12 kg — 20 reps · cardio', cue:'Bell at the chest, elbows inside the knees at the bottom. Keep the pace up — this one is meant to raise the heart rate.' }
      ]
    },

    { id:'day2', type:'circuit', title:'Day 2', subtitle:'Pull Strength + Cardio', rounds:4, work:40, rest:20,
      items:[
        { name:'Bent-over row \u2014 underhand', sub:'12 kg — 10/side', cue:'Palm facing forward, not toward you. Flat-back hinge, elbow close to your ribs \u2014 the underhand grip brings the biceps in.' },
        { name:'Goblet squat', sub:'12 kg — 25 reps · cardio', cue:'Bell at the chest, elbows inside the knees at the bottom. Keep the pace up — this one is meant to raise the heart rate.' },
        { name:'Bird-dog row', sub:'8 kg — 8/side', cue:'Hands and knees, row one arm up while extending the opposite leg straight back.' },
        { name:'High pulls', sub:'12 kg \u2014 12 reps \u00B7 cardio', cue:'Like a swing, but pull the bell up close to chest height, elbow leading.' },
        { name:'KB curl, single arm', sub:'8 kg — 10/side (12 kg once strict)', cue:'Elbow pinned at your ribs, no torso swing. Lower slowly \u2014 that half builds the most.' }
      ]
    },

    { id:'day3', type:'complex', title:'Day 3', subtitle:'Full-Body Complex', rounds:5, restBetween:30,
      weight:'Single KB \u2014 start 8 kg, progress to 12 kg', reps:'6 reps each move, then switch sides',
      sequence:[
        { name:'Clean', cue:'Swing the bell up from between your legs, catch it in the rack position.' },
        { name:'Press', cue:'Drive the bell straight overhead from the rack position.' },
        { name:'Reverse lunge', cue:'Step back, back knee toward the ground, drive through the front heel.' },
        { name:'Swing', cue:'Hip hinge and snap the bell up to chest height.' }
      ]
    },

    { id:'day4', type:'circuit', title:'Day 4', subtitle:'Push/Pull Combo + Core', rounds:4, work:40, rest:20,
      items:[
        { name:'Thrusters', sub:'12 kg — 15 reps', cue:'Goblet squat into an overhead press, driven by the legs.' },
        { name:'Single-arm row', sub:'12 kg — 10/side', cue:'Hinge, row one side, control the lowering.' },
        { name:'Plank', sub:'40 sec', cue:'Straight line, brace core, squeeze glutes.' },
        { name:'Single-arm swing', sub:'12 kg \u2014 10/side \u00B7 cardio', cue:'Same hip snap as a two-hand swing, one arm on the bell. Keep your shoulders square \u2014 the load will try to twist you.' },
        { name:'KB curl, single arm', sub:'8 kg \u2014 10/side', cue:'Slow 3-second lowering on every rep. Elbow pinned at your ribs, no torso swing.' }
      ]
    },

    { id:'day5', type:'emom', title:'Day 5', subtitle:'Cardio Engine \u00B7 EMOM', minutes:18, items:[
      { name:'KB swings', sub:'12 kg — 15 reps', cue:'Hip hinge and snap \u2014 not a squat.' },
      { name:'Push-ups', sub:'10 reps', cue:'Straight line head to heels.' },
      { name:'Goblet squat', sub:'8 kg — 25 reps', cue:'Bell at the chest, elbows inside the knees at the bottom.' }
    ]},

    { id:'cooldown', type:'stretch', title:'Cooldown', subtitle:'~2\u20133 min, every session', items:[
      { name:'Chest doorway stretch', sub:'30 sec each side', cue:'Forearm on the frame, lean forward through the doorway.' },
      { name:'Cross-body shoulder stretch', sub:'30 sec each side', cue:'Pull a straight arm across your chest with the other hand.' },
      { name:'Lat stretch on rail/ledge', sub:'30 sec each side', cue:'Hold a rail or ledge, sink your hips back, let your chest drop.' }
    ]}
  ];

  // ---------- Helpers ----------
  function el(sel){ return document.querySelector(sel); }
  function formatTime(s){
    s = Math.max(0, s);
    var m = Math.floor(s/60), sec = s % 60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }
  function dotsHtml(n){
    var s = '';
    for(var i=0;i<n;i++) s += '<span class="dot" data-i="' + i + '"></span>';
    return s;
  }
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---------- Audio / vibration ----------
  var audioCtx = null;
  function ensureAudio(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      if(!audioCtx) audioCtx = new Ctx();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }catch(e){}
  }
  function beep(freq, ms){
    freq = freq || 880; ms = ms || 150;
    if(!audioCtx) return;
    try{
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + ms/1000);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + ms/1000 + 0.02);
    }catch(e){}
  }
  function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p || 200); }catch(e){} }

  // ---------- Generic countdown ----------
  var activeTimer = null;
  function stopActiveTimer(){
    if(activeTimer){ clearInterval(activeTimer.intervalId); activeTimer = null; }
  }
  function runCountdown(seconds, tickCb, doneCb){
    stopActiveTimer();
    var remaining = seconds;
    tickCb(remaining);
    activeTimer = { intervalId: setInterval(function(){
      remaining--;
      if(remaining <= 0){
        stopActiveTimer();
        beep(880, 200); vibrate(200);
        tickCb(0);
        if(doneCb) doneCb();
        return;
      }
      tickCb(remaining);
    }, 1000) };
  }

  // ---------- Step building ----------
  // Continuous: exercises back-to-back with short transitions, one long rest per round.
  function buildContinuousSteps(day){
    var steps = [];
    for(var r=1; r<=day.rounds; r++){
      for(var i=0;i<day.items.length;i++){
        var ex = day.items[i];
        steps.push({ phase:'work', name:ex.name, sub:ex.sub, dur:day.work, round:r, index:i });
        if(i < day.items.length - 1){
          steps.push({ phase:'transition', name:'Switch', sub:'Next: ' + day.items[i+1].name,
                       dur:TRANSITION, round:r, index:i });
        }
      }
      if(r < day.rounds){
        steps.push({ phase:'rest', name:'Round rest', sub:'Next: ' + day.items[0].name,
                     dur:ROUND_REST, round:r, index:-1 });
      }
    }
    return steps;
  }

  // Intervals: 40s work / 20s rest after every exercise.
  // UNUSED — kept so intervals can be restored by calling this from circuitSteps().
  function buildIntervalSteps(day){
    var steps = [];
    for(var r=1; r<=day.rounds; r++){
      for(var i=0;i<day.items.length;i++){
        var ex = day.items[i];
        steps.push({ phase:'work', name:ex.name, sub:ex.sub, dur:day.work, round:r, index:i });
        var isLast = (r === day.rounds && i === day.items.length - 1);
        if(!isLast){
          var next = day.items[(i+1) % day.items.length];
          steps.push({ phase:'rest', name:'Rest', sub:'Next: ' + next.name,
                       dur:day.rest, round:r, index:i });
        }
      }
    }
    return steps;
  }

  function buildEmomSteps(day){
    var steps = [];
    for(var m=0; m<day.minutes; m++){
      var ex = day.items[m % day.items.length];
      steps.push({ phase:'work', name:ex.name, sub:ex.sub, dur:60,
                   round: Math.floor(m / day.items.length) + 1, index: m % day.items.length });
    }
    return steps;
  }

  function estimateMinutes(steps){
    var total = 0;
    for(var i=0;i<steps.length;i++) total += steps[i].dur;
    return Math.round(total / 60);
  }

  // ---------- Step timer ----------
  var timerState = null;

  function initTimer(steps){
    stopActiveTimer();
    timerState = { steps:steps, stepIdx:0, remaining:steps[0].dur, running:false };
    var bs = el('#btn-start'), bp = el('#btn-pause'), bn = el('#btn-next');
    if(bs) bs.disabled = false;
    if(bp) bp.disabled = true;
    if(bn) bn.disabled = false;
    updateNowPanel();
  }
  function updateNowPanel(){
    if(!timerState) return;
    var labelEl = el('#now-label');
    if(!labelEl) return;
    var step = timerState.steps[timerState.stepIdx];
    el('#now-time').textContent = formatTime(timerState.remaining);
    el('#now-sub').textContent = step.sub;
    labelEl.textContent = step.name;
    var panel = el('#now-panel');
    panel.classList.toggle('phase-work', step.phase === 'work');
    panel.classList.toggle('phase-transition', step.phase === 'transition');
    panel.classList.toggle('phase-rest', step.phase === 'rest');
    updateDots(step.round);
    highlightCurrentExercise(step);
  }
  function updateDots(currentRound){
    var dots = document.querySelectorAll('#round-dots .dot');
    for(var i=0;i<dots.length;i++){
      dots[i].classList.toggle('filled', i < currentRound - 1);
      dots[i].classList.toggle('active', i === currentRound - 1);
    }
  }
  function fillAllDots(){
    var dots = document.querySelectorAll('#round-dots .dot');
    for(var i=0;i<dots.length;i++){ dots[i].classList.add('filled'); dots[i].classList.remove('active'); }
  }
  function highlightCurrentExercise(step){
    var items = document.querySelectorAll('.exitem[data-idx]');
    for(var i=0;i<items.length;i++){
      items[i].classList.toggle('current',
        Number(items[i].dataset.idx) === step.index && step.phase === 'work');
    }
  }
  function finishWorkout(){
    stopActiveTimer();
    timerState.running = false;
    beep(1046, 320); vibrate([200,100,200]);
    el('#now-label').textContent = 'Done';
    el('#now-time').textContent = '00:00';
    el('#now-sub').textContent = 'Nice work';
    el('#now-panel').classList.remove('phase-work','phase-transition','phase-rest');
    fillAllDots();
    el('#btn-start').disabled = true;
    el('#btn-pause').disabled = true;
    var bn = el('#btn-next');
    if(bn) bn.disabled = true;
  }
  // Move to the next step now — from the countdown hitting zero, or the Next button.
  function advanceStep(){
    if(!timerState) return;
    var finishedPhase = timerState.steps[timerState.stepIdx].phase;
    timerState.stepIdx++;
    if(timerState.stepIdx >= timerState.steps.length){ finishWorkout(); return; }
    var nextPhase = timerState.steps[timerState.stepIdx].phase;
    if(nextPhase === 'work'){ beep(950, 180); vibrate(200); }
    else if(finishedPhase === 'work'){ beep(760, 140); vibrate(120); }
    timerState.remaining = timerState.steps[timerState.stepIdx].dur;
    updateNowPanel();
  }
  function tick(){
    if(!timerState || !timerState.running) return;
    timerState.remaining -= 1;

    if(timerState.remaining === 3 && timerState.steps[timerState.stepIdx].phase !== 'work'){
      beep(660, 90); // short heads-up before work resumes
    }
    if(timerState.remaining <= 0){ advanceStep(); return; }
    updateNowPanel();
  }
  function startTimer(){
    if(!timerState) return;
    timerState.running = true;
    el('#btn-start').disabled = true;
    el('#btn-pause').disabled = false;
    stopActiveTimer();
    activeTimer = { intervalId: setInterval(tick, 1000) };
  }
  function pauseTimer(){
    if(!timerState) return;
    timerState.running = false;
    stopActiveTimer();
    var bs = el('#btn-start'), bp = el('#btn-pause');
    if(bs) bs.disabled = false;
    if(bp) bp.disabled = true;
  }

  // ---------- Circuit day wiring ----------
  function circuitSteps(day){
    return buildContinuousSteps(day);
  }
  function refreshCircuitMeta(day){
    var steps = circuitSteps(day);
    var metaEl = el('#mode-meta');
    if(metaEl){
      metaEl.innerHTML = day.rounds + ' rounds \u00B7 <b>' + day.work + 's per move, back-to-back</b> \u00B7 '
        + TRANSITION + 's switch \u00B7 ' + ROUND_REST + 's rest between rounds \u00B7 ~'
        + estimateMinutes(steps) + ' min';
    }
    return steps;
  }
  function attachCircuitHandlers(day){
    initTimer(refreshCircuitMeta(day));

    el('#btn-start').onclick = function(){ ensureAudio(); startTimer(); };
    el('#btn-pause').onclick = function(){ pauseTimer(); };
    el('#btn-next').onclick = function(){ ensureAudio(); advanceStep(); };
    el('#btn-reset').onclick = function(){ pauseTimer(); initTimer(refreshCircuitMeta(day)); };
  }

  function attachEmomHandlers(day){
    initTimer(buildEmomSteps(day));
    el('#btn-start').onclick = function(){ ensureAudio(); startTimer(); };
    el('#btn-pause').onclick = function(){ pauseTimer(); };
    el('#btn-next').onclick = function(){ ensureAudio(); advanceStep(); };
    el('#btn-reset').onclick = function(){ pauseTimer(); initTimer(buildEmomSteps(day)); };
  }

  // ---------- Day 3 complex ----------
  function attachComplexHandlers(day){
    var round = 1;
    var total = day.rounds;
    function renderRoundText(){
      el('#round-text').textContent = round > total ? 'Complex complete' : 'Round ' + round + ' of ' + total;
    }
    function updateComplexDots(){
      var dots = document.querySelectorAll('#round-dots .dot');
      for(var i=0;i<dots.length;i++){
        dots[i].classList.toggle('filled', i < round - 1);
        dots[i].classList.toggle('active', i === round - 1 && round <= total);
      }
    }
    renderRoundText(); updateComplexDots();
    var btnComplete = el('#btn-complete'), btnSkip = el('#btn-skip'), restDisplay = el('#rest-display');

    btnComplete.onclick = function(){
      ensureAudio();
      if(round > total) return;
      beep(1046, 200); vibrate(150);
      round++;
      updateComplexDots();
      renderRoundText();
      if(round > total){
        restDisplay.textContent = 'Nice work';
        btnComplete.disabled = true; btnSkip.disabled = true;
        return;
      }
      runCountdown(day.restBetween, function(s){
        restDisplay.textContent = s > 0 ? 'Rest ' + formatTime(s) : 'Go!';
      });
    };
    btnSkip.onclick = function(){ stopActiveTimer(); restDisplay.textContent = 'Go!'; };
  }

  // ---------- Cooldown ----------
  function attachStretchHandlers(day){
    day.items.forEach(function(it, i){
      var btn = el('#stretch-btn-' + i);
      var chip = el('#stretch-time-' + i);
      btn.onclick = function(){
        ensureAudio();
        btn.disabled = true;
        runCountdown(30, function(s){ chip.textContent = s > 0 ? formatTime(s) : 'Done'; },
                     function(){ btn.disabled = false; });
      };
    });
  }

  // ---------- Renderers ----------
  function exListHtml(day){
    var html = day.items.map(function(it, i){
      return '<li class="exitem" data-idx="' + i + '">' +
        '<div class="exname">' + esc(it.name) + '</div>' +
        '<div class="exsub">' + esc(it.sub) + '</div>' +
        '<details class="cue"><summary>Cue</summary><p>' + esc(it.cue) + '</p></details>' +
      '</li>';
    }).join('');
    return '<ul class="exlist">' + html + '</ul>';
  }
  function nowPanelHtml(dotCount){
    return '<div class="now" id="now-panel">' +
        '<div class="now-label" id="now-label">Ready</div>' +
        '<div class="now-time" id="now-time">00:00</div>' +
        '<div class="now-sub" id="now-sub"></div>' +
        '<div class="dots" id="round-dots">' + dotsHtml(dotCount) + '</div>' +
        '<div class="controls">' +
          '<button class="btn btn-primary" id="btn-start">Start</button>' +
          '<button class="btn btn-secondary" id="btn-pause" disabled>Pause</button>' +
          '<button class="btn btn-secondary" id="btn-next">Next ▸</button>' +
          '<button class="btn btn-secondary" id="btn-reset">Reset</button>' +
        '</div>' +
      '</div>';
  }
  function renderCircuit(day){
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<div class="info" id="mode-meta"></div>' +
      '<div class="tip">Moves run back-to-back \u2014 the 10s switch is for grabbing the bell, not resting.</div>' +
      nowPanelHtml(day.rounds) +
      exListHtml(day) + '</section>';
  }
  function renderEmom(day){
    var cycleTotal = Math.ceil(day.minutes / day.items.length);
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<div class="info">' + day.minutes + ' min EMOM \u00B7 cycle: ' +
        day.items.map(function(it){ return esc(it.name); }).join(' \u2192 ') + '</div>' +
      '<div class="tip">Finish the reps early? That rest is the point \u2014 but if you\u2019re getting 20s+ back every minute, add reps.</div>' +
      nowPanelHtml(cycleTotal) +
      exListHtml(day) + '</section>';
  }
  function renderComplex(day){
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<div class="info"><b>' + esc(day.weight) + '</b> \u00B7 ' + esc(day.reps) + '</div>' +
      '<ol class="seqlist">' + day.sequence.map(function(s, i){
        return '<li class="seqitem"><span class="seqnum">' + (i+1) + '.</span><span><b>' +
          esc(s.name) + '</b> \u2014 ' + esc(s.cue) + '</span></li>';
      }).join('') + '</ol>' +
      '<div class="now" id="now-panel">' +
        '<div class="now-label" id="round-text">Round 1 of ' + day.rounds + '</div>' +
        '<div class="now-sub" id="rest-display">Rest ' + day.restBetween + 's between rounds</div>' +
        '<div class="dots" id="round-dots">' + dotsHtml(day.rounds) + '</div>' +
        '<div class="controls">' +
          '<button class="btn btn-primary" id="btn-complete">Complete round</button>' +
          '<button class="btn btn-secondary" id="btn-skip">Skip rest</button>' +
        '</div>' +
      '</div></section>';
  }
  function renderList(day){
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<ul class="exlist checklist">' + day.items.map(function(it){
        return '<li class="exitem">' +
          '<label class="checkline"><input type="checkbox" /><span class="exname">' + esc(it.name) + '</span></label>' +
          '<div class="exsub">' + esc(it.sub) + '</div>' +
          '<details class="cue"><summary>Cue</summary><p>' + esc(it.cue) + '</p></details>' +
        '</li>';
      }).join('') + '</ul></section>';
  }
  function renderStretch(day){
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<ul class="exlist">' + day.items.map(function(it, i){
        return '<li class="exitem">' +
          '<div class="stretch-row">' +
            '<div><div class="exname">' + esc(it.name) + '</div>' +
            '<div class="exsub">' + esc(it.sub) + '</div></div>' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
              '<span class="timer-chip" id="stretch-time-' + i + '"></span>' +
              '<button class="btn btn-secondary" id="stretch-btn-' + i + '">Start 30s</button>' +
            '</div>' +
          '</div>' +
          '<details class="cue"><summary>Cue</summary><p>' + esc(it.cue) + '</p></details>' +
        '</li>';
      }).join('') + '</ul></section>';
  }

  // ---------- Tabs ----------
  function selectTab(id){
    stopActiveTimer();
    timerState = null;
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].dataset.tab === id);
    var day = DAYS.filter(function(d){ return d.id === id; })[0];
    var content = el('#content');
    if(day.type === 'list'){ content.innerHTML = renderList(day); }
    else if(day.type === 'stretch'){ content.innerHTML = renderStretch(day); attachStretchHandlers(day); }
    else if(day.type === 'circuit'){ content.innerHTML = renderCircuit(day); attachCircuitHandlers(day); }
    else if(day.type === 'emom'){ content.innerHTML = renderEmom(day); attachEmomHandlers(day); }
    else if(day.type === 'complex'){ content.innerHTML = renderComplex(day); attachComplexHandlers(day); }
    window.scrollTo(0,0);
  }

  document.addEventListener('DOMContentLoaded', function(){
    el('#tabs').innerHTML = DAYS.map(function(d){
      return '<button class="tab" data-tab="' + d.id + '">' + d.title + '</button>';
    }).join('');
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      (function(t){ t.addEventListener('click', function(){ selectTab(t.dataset.tab); }); })(tabs[i]);
    }
    selectTab(DAYS[0].id);
  });
</script>
</body>
</html>
