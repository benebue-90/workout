<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#ECEEE8" />
<title>Terrace Kettlebell Workout</title>
<style>
  :root{
    --bg:#ECEEE8;
    --panel:#FFFFFF;
    --ink:#1C1F1D;
    --muted:#6B6F68;
    --line:#D8D3C4;
    --work:#B23A20;
    --trans:#B8892B;
    --rest:#3B6E71;
    --accent:#B8892B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);}
  .brand{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;cursor:pointer;
    font-family:inherit;text-align:left;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;
    color:var(--muted);padding:10px 16px 6px;}
  .prog-pill{background:var(--accent);color:var(--accent-ink,#1C1F1D);border-radius:999px;padding:3px 9px;
    font-size:11px;letter-spacing:.08em;}
  .brand-caret{font-size:10px;}
  .sheet-backdrop{position:fixed;inset:0;z-index:50;background:rgba(28,31,29,.45);
    display:flex;align-items:flex-end;justify-content:center;}
  .sheet-backdrop[hidden]{display:none;}
  .sheet{width:100%;max-width:480px;background:var(--bg);border-radius:16px 16px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));}
  .sheet-title{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted);
    margin:0 0 12px;}
  .prog-option{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px;font-family:inherit;
    color:var(--ink);cursor:pointer;}
  .prog-option.active{border-color:var(--opt-accent);box-shadow:0 0 0 1px var(--opt-accent) inset;}
  .prog-dot{width:12px;height:12px;border-radius:50%;background:var(--opt-accent);flex:0 0 auto;}
  .prog-name{display:block;font-weight:800;font-size:15px;}
  .prog-blurb{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:3px;}
  .prog-check{margin-left:auto;font-weight:800;font-size:18px;color:var(--opt-accent);}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;}
  .tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .parts{display:flex;gap:4px;margin:0 0 14px;padding:4px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;}
  .part{flex:1 1 0;border:none;background:transparent;color:var(--muted);padding:10px 8px;border-radius:9px;
    font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.03em;min-height:40px;}
  .part.active{background:var(--ink);color:var(--bg);}
  main{flex:1;padding:16px 16px 40px;}
  h1{font-size:clamp(22px,7vw,28px);font-weight:800;margin:4px 0 2px;text-transform:uppercase;letter-spacing:.01em;}
  .subtitle{color:var(--muted);font-weight:600;margin:0 0 14px;font-size:14px;}
  .info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    margin-bottom:10px;font-size:14px;font-weight:600;color:var(--muted);}
  .info b{color:var(--ink);}
  .tip{font-size:12px;color:var(--muted);font-style:italic;margin:0 0 14px;}
  .now-sticky{position:sticky;top:var(--topbar-h,92px);z-index:9;background:var(--bg);
    padding:10px 0 12px;margin-bottom:6px;}
  .now{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
    margin-bottom:0;text-align:center;transition:border-color .15s ease;}
  .now.phase-work{border-color:var(--work);}
  .now.phase-transition{border-color:var(--trans);}
  .now.phase-rest{border-color:var(--rest);}
  .now-label{font-size:clamp(17px,6vw,21px);font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
  .now-time{font-size:clamp(42px,16vw,64px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:4px 0;}
  .now.phase-work .now-time{color:var(--work);}
  .now.phase-transition .now-time{color:var(--trans);}
  .now.phase-rest .now-time{color:var(--rest);}
  .now-sub{color:var(--muted);font-weight:600;font-size:14px;min-height:18px;}
  .dots{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:transparent;
    transition:background-color .15s ease,border-color .15s ease;}
  .dot.filled{background:var(--accent);border-color:var(--accent);}
  .dot.active{border-color:var(--work);}
  .controls{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:nowrap;}
  .controls .btn{flex:1 1 0;min-width:0;padding:12px 8px;white-space:nowrap;
    font-size:clamp(12px,3.4vw,14px);letter-spacing:.02em;}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-weight:800;font-size:14px;
    text-transform:uppercase;letter-spacing:.03em;min-height:44px;}
  .btn-primary{background:var(--ink);color:var(--bg);}
  .btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.4;}
  .exlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .exitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .exitem.current{border-color:var(--work);box-shadow:0 0 0 1px var(--work) inset;}
  .checkline{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .checkline input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--ink);}
  .exname{font-weight:700;font-size:16px;}
  input:checked + .exname{opacity:.45;text-decoration:line-through;}
  .exsub{color:var(--muted);font-size:13px;margin:4px 0;font-weight:600;}
  .checklist .exsub{margin-left:30px;}
  .cue summary{color:var(--rest);font-weight:700;font-size:12px;text-transform:uppercase;
    letter-spacing:.04em;cursor:pointer;list-style:none;}
  .cue summary::-webkit-details-marker{display:none;}
  .cue p{margin:6px 0 0;font-size:14px;color:var(--ink);}
  .checklist .cue{margin-left:30px;}
  .seqlist{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px;}
  .seqitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
    display:flex;align-items:baseline;gap:8px;font-size:14px;}
  .seqnum{font-weight:800;color:var(--accent);flex:0 0 auto;}
  .stretch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .timer-chip{font-variant-numeric:tabular-nums;font-weight:800;min-width:44px;text-align:right;font-size:14px;}
  footer.note{padding:10px 16px calc(20px + env(safe-area-inset-bottom));color:var(--muted);
    font-size:12px;text-align:center;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="brand" id="brand" aria-haspopup="dialog" aria-expanded="false">Terrace KB <span class="prog-pill" id="prog-pill"></span><span class="brand-caret" aria-hidden="true">▾</span></button>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="content"></main>
  <footer class="note">Turn Silent Mode off for beeps. Vibration works either way.</footer>
</div>
<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-label="Choose program">
    <div class="sheet-title">Program</div>
    <div id="sheet-list"></div>
  </div>
</div>

<script>
  // ---------- Config ----------
  var TRANSITION = 10;   // seconds between exercises in continuous mode
  var ROUND_REST = 30;   // seconds rest at the end of a continuous round

  // ---------- Data ----------
  // ---------- Shared by every program ----------
  var WARMUP = { id:'warmup', type:'list', title:'Warm-up', subtitle:'~4 min, every session', items:[
      { name:'Arm circles', sub:'20 sec each direction', cue:'Small circles, gradually bigger, then reverse direction.' },
      { name:'Kettlebell halos', sub:'8 kg — 10 each way', cue:'Hold the horns at chest height, circle it around your head, brace your core.' },
      { name:'Bodyweight squats', sub:'15 reps', cue:'Hips back, chest up, drive through your heels.' },
      { name:'Inchworm walkout', sub:'8 reps (alt: Cat-Cow, 10 reps)', cue:'Hinge, walk your hands out to a plank, walk back, stand up.' },
      { name:'Shoulder pass-throughs', sub:'10 reps', cue:'Swing straight arms up and back overhead in a wide arc.' }
    ]};

  var COOLDOWN = { id:'cooldown', type:'stretch', title:'Cooldown', subtitle:'~2\u20133 min, every session', items:[
      { name:'Chest doorway stretch', sub:'30 sec each side', cue:'Forearm on the frame, lean forward through the doorway.' },
      { name:'Cross-body shoulder stretch', sub:'30 sec each side', cue:'Pull a straight arm across your chest with the other hand.' },
      { name:'Lat stretch on rail/ledge', sub:'30 sec each side', cue:'Hold a rail or ledge, sink your hips back, let your chest drop.' }
    ]};

  // ---------- V1 · Classic ----------
  // Follow-on blocks (run after the main workout, via the part switch)
  var CORE = { type:'complex', title:'Core', subtitle:'After the workout', rounds:4, restBetween:30,
      weight:'Single KB — 12 kg (first move only)', reps:'4 rounds · 30s rest between rounds',
      sequence:[
        { name:'Iron trident', reps:'20 reps (alt: Russian twist, 20 reps)', cue:'Seated, legs straight in a V. Set the bell down outside the right hip, then between the legs, then outside the left hip \u2014 all three touches is one rep. Place it each time; this is not a fast twist.' },
        { name:'Side plank \u2014 right', reps:'30 sec', cue:'Elbow under the shoulder, feet stacked. Drive the hip up so you make a straight line ankle to ear, and hold it \u2014 the hip dropping is the set ending, not a rest position.' },
        { name:'Side plank \u2014 left', reps:'30 sec', cue:'Same setup on the other side. Match the right side\u2019s time even if this one is weaker \u2014 that is the side worth the work.' },
        { name:'Crunches', reps:'20 reps', cue:'Lower back stays flat on the floor, ribs down toward the hips. Hands by your ears, not pulling on your neck \u2014 and lower slowly rather than dropping.' }
      ]};

  var DAY2_EMOM = { type:'emom', title:'Cardio EMOM', subtitle:'10 min · after the workout', minutes:10, items:[
      { name:'KB swings', sub:'12 kg — 20 reps', cue:'Hip hinge and snap — not a squat. Let the bell float, don’t lift it with your arms.' },
      { name:'Reverse lunges', sub:'8 kg goblet — 20 reps (10/side)', cue:'Bell at the chest, step back, back knee toward the floor, drive up through the front heel. Alternate legs.' }
    ]};

  var DAY4_EMOM = { type:'emom', title:'Cardio EMOM', subtitle:'10 min · after the workout', minutes:10, items:[
      { name:'Goblet squats', sub:'12 kg — 20 reps', cue:'Bell at the chest, elbows inside the knees at the bottom. Steady pace, full depth.' },
      { name:'Mountain climbers', sub:'20/side', cue:'High plank, drive the knees toward the chest one at a time. Hips level — don’t let them bounce up.' }
    ]};

  var V1_DAYS = [
    WARMUP,

    { id:'day1', type:'circuit', title:'Day 1', subtitle:'Push Power + Cardio', rounds:4, work:40, rest:20, after:CORE,
      items:[
        { name:'Goblet push press', sub:'12 kg — 15 reps', cue:'Dip your knees, drive up through your legs, press the bell overhead.' },
        { name:'Push-ups', sub:'To failure', cue:'Straight line head to heels, elbows about 45\u00B0 from your body. Go until form breaks \u2014 drop to your knees and keep pressing rather than stopping early.' },
        { name:'KB swings', sub:'12 kg \u2014 20 reps \u00B7 cardio', cue:'Hip hinge and snap \u2014 not a squat. Let the bell float, don\u2019t lift it with your arms.' },
        { name:'Floor press, alternating', sub:'12 kg — 8/side', cue:'Lying on your back, press one arm up, lower with control, switch.' },
        { name:'Goblet squat', sub:'12 kg — 20 reps · cardio', cue:'Bell at the chest, elbows inside the knees at the bottom. Keep the pace up — this one is meant to raise the heart rate.' }
      ]
    },

    { id:'day2', type:'circuit', title:'Day 2', subtitle:'Pull Strength + Cardio', rounds:4, work:40, rest:20, after:DAY2_EMOM,
      items:[
        { name:'Bent-over row \u2014 underhand', sub:'12 kg — 10/side', cue:'Palm facing forward, not toward you. Flat-back hinge, elbow close to your ribs \u2014 the underhand grip brings the biceps in.' },
        { name:'Goblet squat', sub:'12 kg — 25 reps · cardio', cue:'Bell at the chest, elbows inside the knees at the bottom. Keep the pace up — this one is meant to raise the heart rate.' },
        { name:'KB pullover', sub:'12 kg — 12 reps', cue:'Lie on your back, bell held by the horns over your chest. Soft bend in the elbows, lower it back behind your head until the lats stretch, then pull it back over. Ribs stay down \u2014 don\u2019t let your back arch off the floor.' },
        { name:'High pulls', sub:'12 kg \u2014 12 reps \u00B7 cardio', cue:'Like a swing, but pull the bell up close to chest height, elbow leading.' },
        { name:'KB curl, single arm', sub:'8 kg — 10/side (12 kg once strict)', cue:'Elbow pinned at your ribs, no torso swing. Lower slowly \u2014 that half builds the most.' }
      ]
    },

    { id:'day3', type:'complex', title:'Day 3', subtitle:'Full-Body Complex', rounds:5, restBetween:30, after:CORE,
      weight:'Single KB \u2014 8 kg', reps:'8 reps each move, then switch sides \u00B7 push-ups to finish every round',
      sequence:[
        { name:'Clean', cue:'Swing the bell up from between your legs, catch it in the rack position.' },
        { name:'Press', cue:'Drive the bell straight overhead from the rack position.' },
        { name:'Reverse lunge with rotation', cue:'Step back, back knee toward the ground, then rotate the bell across over the front leg. Hips stay square \u2014 the twist comes from the ribs, not the pelvis.' },
        { name:'Swing', cue:'Hip hinge and snap the bell up to chest height.' },
        { name:'Push-ups', reps:'To failure', cue:'Bell down, straight into push-ups to close the round. Go until form breaks \u2014 knees down and keep pressing rather than stopping early.' }
      ]
    },

    { id:'day4', type:'circuit', title:'Day 4', subtitle:'Push/Pull Combo + Core', rounds:4, work:40, rest:20, after:DAY4_EMOM,
      items:[
        { name:'Thrusters', sub:'12 kg — 15 reps', cue:'Goblet squat into an overhead press, driven by the legs.' },
        { name:'Single-arm row', sub:'12 kg — 10/side', cue:'Hinge, row one side, control the lowering.' },
        { name:'Plank', sub:'40 sec', cue:'Straight line, brace core, squeeze glutes.' },
        { name:'Single-arm swing', sub:'12 kg \u2014 10/side \u00B7 cardio', cue:'Same hip snap as a two-hand swing, one arm on the bell. Keep your shoulders square \u2014 the load will try to twist you.' },
        { name:'KB curl, single arm', sub:'8 kg \u2014 10/side', cue:'Slow 3-second lowering on every rep. Elbow pinned at your ribs, no torso swing.' }
      ]
    },

    { id:'day5', type:'emom', title:'Day 5', subtitle:'Cardio Engine \u00B7 EMOM', minutes:18, after:CORE, items:[
      { name:'KB swings', sub:'12 kg — 20 reps', cue:'Hip hinge and snap \u2014 not a squat.' },
      { name:'Push-ups', sub:'20 reps', cue:'Straight line head to heels.' },
      { name:'Goblet squat', sub:'12 kg — 25 reps', cue:'Bell at the chest, elbows inside the knees at the bottom.' }
    ]},

    COOLDOWN
  ];

  // ---------- V2 · Shoulders ----------
  var V2_GETUPS = { type:'emom', title:'Get-ups', subtitle:'6 min · before the complex', minutes:6,
    tip:'One slow rep per minute, alternating sides. Use the rest of the minute to reset — this is about control, not speed.',
    items:[
      { name:'Turkish get-up — right', sub:'8 kg → 12 kg · 1 slow rep', cue:'Bell in the right hand, arm locked out, eyes on the bell the whole way. Roll to the elbow, then the hand, bridge the hips, sweep the left leg through to a kneel and stand. Reverse it slowly to lie back down.' },
      { name:'Turkish get-up — left', sub:'8 kg → 12 kg · 1 slow rep', cue:'Mirror of the right side: bell in the left hand, arm locked, eyes on the bell. Move to 12 kg only once both sides feel smooth at 8 kg.' }
    ]};

  var V2_DAY2_EMOM = { type:'emom', title:'Cardio EMOM', subtitle:'10 min · after the workout', minutes:10, items:[
      { name:'Single-arm swing', sub:'16 kg — 10/side', cue:'Same hip snap as a two-hand swing, one hand on the bell. Keep your shoulders square — the load will try to twist you.' },
      { name:'Reverse lunges', sub:'12 kg goblet — 20 reps (10/side)', cue:'Bell at the chest, step back, back knee toward the floor, drive up through the front heel. Alternate legs.' }
    ]};

  var V2_DAY4_EMOM = { type:'emom', title:'Cardio EMOM', subtitle:'10 min · after the workout', minutes:10, items:[
      { name:'Goblet squats', sub:'16 kg — 12 reps', cue:'Bell at the chest, elbows inside the knees at the bottom. Full depth, steady pace.' },
      { name:'Mountain climbers', sub:'20/side', cue:'High plank, drive the knees toward the chest one at a time. Hips level — don’t let them bounce up.' }
    ]};

  var V2_DAYS = [
    WARMUP,

    { id:'day1', type:'circuit', title:'Day 1', subtitle:'Press · Shoulders + Chest', rounds:4, work:40, rest:20,
      items:[
        { name:'Push press', sub:'16 kg — 6/side', cue:'Bell in the rack. Short dip at the knees, then drive up hard and let the legs launch the bell overhead. Lock out, lower under control back to the rack.' },
        { name:'Floor press', sub:'16 kg — 8/side', cue:'On your back, elbow on the floor at about 45°. Press straight up, pause at the top, lower until the elbow touches.' },
        { name:'Lateral raise', sub:'8 kg — 10/side', cue:'Bell by the handle at your side, soft elbow. Raise it out to shoulder height leading with the elbow — no swinging.' },
        { name:'Decline push-ups', sub:'Feet on a ledge — max reps', cue:'Feet on a bench or ledge, hands a little wider than the shoulders. Straight line head to heels — the decline shifts the work to upper chest and shoulders.' },
        { name:'KB swings', sub:'16 kg — 15 reps · cardio', cue:'Hip hinge and snap — not a squat. Let the bell float, don’t lift it with your arms.' },
        { name:'Suitcase march', sub:'16 kg — 20 sec/side', cue:'Bell in one hand at your side, march on the spot. Stay perfectly upright — don’t lean away from the bell. Switch hands at 20 seconds.' }
      ]
    },

    { id:'day2', type:'circuit', title:'Day 2', subtitle:'Pull · Back, Traps + Rear Delts', rounds:4, work:40, rest:20, after:V2_DAY2_EMOM,
      items:[
        { name:'Bent-over row', sub:'16 kg — 10/side', cue:'Flat-back hinge, free hand on your knee. Pull the bell to your hip with the elbow close to the ribs, lower under control.' },
        { name:'High pulls', sub:'16 kg — 12 reps · cardio', cue:'Like a swing, but pull the bell up close to chest height, elbow leading high. Squeeze the upper back at the top.' },
        { name:'Rear-delt fly', sub:'8 kg — 10/side', cue:'Hinge over, bell hanging under the shoulder. Raise it out to the side with a soft elbow until the arm is level with your back. Slow on the way down.' },
        { name:'Suitcase shrug', sub:'16 kg — 12/side', cue:'Stand tall, bell at your side. Shrug straight up toward the ear, hold a beat, lower slowly. No rolling the shoulders.' },
        { name:'Half-kneeling woodchop', sub:'8 kg — 8/side', cue:'Kneel on one knee, bell by the horns. Chop diagonally from high over one shoulder to low past the opposite hip. The twist comes from the ribs — hips stay square.' }
      ]
    },

    { id:'day3', type:'complex', title:'Day 3', subtitle:'Technical · Get-ups + Complex', rounds:5, restBetween:30,
      before:V2_GETUPS, mainLabel:'Complex',
      weight:'Single KB — 12 kg', reps:'5 reps each move, then switch sides',
      sequence:[
        { name:'Clean', cue:'Swing the bell up from between your legs and catch it softly in the rack, forearm vertical.' },
        { name:'Press', cue:'Strict, from the rack straight overhead. Lock out with the biceps by the ear.' },
        { name:'Windmill', cue:'From the lockout, feet turned out away from the bell. Eyes on the bell, push the hip out and slide the free hand down the inside of the leg. Arm stays vertical — come back up by squeezing the obliques.' },
        { name:'Front-rack reverse lunge', cue:'Bell back in the rack. Step back, back knee toward the floor, drive up through the front heel.' }
      ]
    },

    { id:'day4', type:'circuit', title:'Day 4', subtitle:'Upper Body + Legs', rounds:4, work:40, rest:20, after:V2_DAY4_EMOM,
      items:[
        { name:'Single-leg RDL', sub:'16 kg — 8/side', cue:'Bell in the hand opposite the standing leg. Hinge forward with the back leg reaching behind you until the hamstring stretches. Hips stay level.' },
        { name:'Z-press', sub:'12 kg — 8/side', cue:'Sit on the floor, legs straight out in front, no back support. Press overhead without leaning back — the core has to hold you upright.' },
        { name:'Squeeze press', sub:'16 kg — 12 reps', cue:'On your back, hands on the sides of the bell, palms crushing it together. Keep squeezing as you press up and lower — the squeeze is what works the chest.' },
        { name:'KB pullover', sub:'12–16 kg — 12 reps', cue:'Lie on your back, bell by the horns over your chest. Soft elbows, lower it behind your head until the lats stretch, pull it back over. Ribs stay down.' },
        { name:'Lateral raise', sub:'8 kg — 12/side', cue:'Bell at your side, soft elbow, raise out to shoulder height leading with the elbow. Slow and controlled — no swinging.' }
      ]
    },

    { id:'day5', type:'emom', title:'Day 5', subtitle:'Conditioning + Obliques · EMOM', minutes:20, items:[
      { name:'KB swings', sub:'16 kg — 15 reps', cue:'Hip hinge and snap — not a squat.' },
      { name:'Push-ups', sub:'15 reps', cue:'Straight line head to heels, elbows about 45° from your body.' },
      { name:'Alternating cleans', sub:'12 kg — 6/side', cue:'Swing the bell up and catch it softly in the rack. Six on one side, then six on the other — the upper back and traps do the pulling.' },
      { name:'Iron trident', sub:'12 kg — 12 reps (alt: Russian twist)', cue:'Seated, legs straight in a V. Bell outside the right hip, between the legs, outside the left hip — three touches is one rep. Place it each time.' }
    ]},

    COOLDOWN
  ];

  // ---------- Programs ----------
  var PROGRAMS = [
    { id:'v1', name:'V1 · Classic', short:'V1 Classic', accent:'#B8892B', accentInk:'#1C1F1D', days:V1_DAYS,
      blurb:'The original routine: push/pull circuits, full-body complex, core or cardio after each day.' },
    { id:'v2', name:'V2', short:'V2', accent:'#2D5B9A', accentInk:'#FFFFFF', days:V2_DAYS,
      blurb:'Shoulders, traps and obliques first. 16 kg, fewer push-ups and squats, core built into every day.' }
  ];
  var program = PROGRAMS[0];
  var DAYS = program.days;

  // ---------- Helpers ----------
  function el(sel){ return document.querySelector(sel); }
  function formatTime(s){
    s = Math.max(0, s);
    var m = Math.floor(s/60), sec = s % 60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }
  function dotsHtml(n){
    var s = '';
    for(var i=0;i<n;i++) s += '<span class="dot" data-i="' + i + '"></span>';
    return s;
  }
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---------- Audio / vibration ----------
  var audioCtx = null;
  function ensureAudio(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      if(!audioCtx) audioCtx = new Ctx();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }catch(e){}
  }
  function beep(freq, ms){
    freq = freq || 880; ms = ms || 150;
    if(!audioCtx) return;
    try{
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + ms/1000);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + ms/1000 + 0.02);
    }catch(e){}
  }
  function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p || 200); }catch(e){} }

  // ---------- Generic countdown ----------
  var activeTimer = null;
  function stopActiveTimer(){
    if(activeTimer){ clearInterval(activeTimer.intervalId); activeTimer = null; }
  }
  function runCountdown(seconds, tickCb, doneCb){
    stopActiveTimer();
    var remaining = seconds;
    tickCb(remaining);
    activeTimer = { intervalId: setInterval(function(){
      remaining--;
      if(remaining <= 0){
        stopActiveTimer();
        beep(880, 200); vibrate(200);
        tickCb(0);
        if(doneCb) doneCb();
        return;
      }
      tickCb(remaining);
    }, 1000) };
  }

  // ---------- Step building ----------
  // Continuous: exercises back-to-back with short transitions, one long rest per round.
  function buildContinuousSteps(day){
    var steps = [];
    for(var r=1; r<=day.rounds; r++){
      for(var i=0;i<day.items.length;i++){
        var ex = day.items[i];
        steps.push({ phase:'work', name:ex.name, sub:ex.sub, dur:day.work, round:r, index:i });
        if(i < day.items.length - 1){
          steps.push({ phase:'transition', name:'Switch', sub:'Next: ' + day.items[i+1].name,
                       dur:TRANSITION, round:r, index:i });
        }
      }
      if(r < day.rounds){
        steps.push({ phase:'rest', name:'Round rest', sub:'Next: ' + day.items[0].name,
                     dur:ROUND_REST, round:r, index:-1 });
      }
    }
    return steps;
  }

  // Intervals: 40s work / 20s rest after every exercise.
  // UNUSED — kept so intervals can be restored by calling this from circuitSteps().
  function buildIntervalSteps(day){
    var steps = [];
    for(var r=1; r<=day.rounds; r++){
      for(var i=0;i<day.items.length;i++){
        var ex = day.items[i];
        steps.push({ phase:'work', name:ex.name, sub:ex.sub, dur:day.work, round:r, index:i });
        var isLast = (r === day.rounds && i === day.items.length - 1);
        if(!isLast){
          var next = day.items[(i+1) % day.items.length];
          steps.push({ phase:'rest', name:'Rest', sub:'Next: ' + next.name,
                       dur:day.rest, round:r, index:i });
        }
      }
    }
    return steps;
  }

  function buildEmomSteps(day){
    var steps = [];
    for(var m=0; m<day.minutes; m++){
      var ex = day.items[m % day.items.length];
      steps.push({ phase:'work', name:ex.name, sub:ex.sub, dur:60,
                   round: Math.floor(m / day.items.length) + 1, index: m % day.items.length });
    }
    return steps;
  }

  function estimateMinutes(steps){
    var total = 0;
    for(var i=0;i<steps.length;i++) total += steps[i].dur;
    return Math.round(total / 60);
  }

  // ---------- Step timer ----------
  var timerState = null;

  function initTimer(steps){
    stopActiveTimer();
    timerState = { steps:steps, stepIdx:0, remaining:steps[0].dur, running:false };
    var bs = el('#btn-start'), bp = el('#btn-pause'), bn = el('#btn-next');
    if(bs) bs.disabled = false;
    if(bp) bp.disabled = true;
    if(bn) bn.disabled = false;
    updateNowPanel();
  }
  function updateNowPanel(){
    if(!timerState) return;
    var labelEl = el('#now-label');
    if(!labelEl) return;
    var step = timerState.steps[timerState.stepIdx];
    el('#now-time').textContent = formatTime(timerState.remaining);
    el('#now-sub').textContent = step.sub;
    labelEl.textContent = step.name;
    var panel = el('#now-panel');
    panel.classList.toggle('phase-work', step.phase === 'work');
    panel.classList.toggle('phase-transition', step.phase === 'transition');
    panel.classList.toggle('phase-rest', step.phase === 'rest');
    updateDots(step.round);
    highlightCurrentExercise(step);
  }
  function updateDots(currentRound){
    var dots = document.querySelectorAll('#round-dots .dot');
    for(var i=0;i<dots.length;i++){
      dots[i].classList.toggle('filled', i < currentRound - 1);
      dots[i].classList.toggle('active', i === currentRound - 1);
    }
  }
  function fillAllDots(){
    var dots = document.querySelectorAll('#round-dots .dot');
    for(var i=0;i<dots.length;i++){ dots[i].classList.add('filled'); dots[i].classList.remove('active'); }
  }
  function highlightCurrentExercise(step){
    var items = document.querySelectorAll('.exitem[data-idx]');
    for(var i=0;i<items.length;i++){
      items[i].classList.toggle('current',
        Number(items[i].dataset.idx) === step.index && step.phase === 'work');
    }
  }
  function finishWorkout(){
    stopActiveTimer();
    timerState.running = false;
    beep(1046, 320); vibrate([200,100,200]);
    el('#now-label').textContent = 'Done';
    el('#now-time').textContent = '00:00';
    el('#now-sub').textContent = 'Nice work';
    el('#now-panel').classList.remove('phase-work','phase-transition','phase-rest');
    fillAllDots();
    el('#btn-start').disabled = true;
    el('#btn-pause').disabled = true;
    var bn = el('#btn-next');
    if(bn) bn.disabled = true;
  }
  // Move to the next step now — from the countdown hitting zero, or the Next button.
  function advanceStep(){
    if(!timerState) return;
    var finishedPhase = timerState.steps[timerState.stepIdx].phase;
    timerState.stepIdx++;
    if(timerState.stepIdx >= timerState.steps.length){ finishWorkout(); return; }
    var nextPhase = timerState.steps[timerState.stepIdx].phase;
    if(nextPhase === 'work'){ beep(950, 180); vibrate(200); }
    else if(finishedPhase === 'work'){ beep(760, 140); vibrate(120); }
    timerState.remaining = timerState.steps[timerState.stepIdx].dur;
    updateNowPanel();
  }
  function tick(){
    if(!timerState || !timerState.running) return;
    timerState.remaining -= 1;

    if(timerState.remaining === 3 && timerState.steps[timerState.stepIdx].phase !== 'work'){
      beep(660, 90); // short heads-up before work resumes
    }
    if(timerState.remaining <= 0){ advanceStep(); return; }
    updateNowPanel();
  }
  function startTimer(){
    if(!timerState) return;
    timerState.running = true;
    el('#btn-start').disabled = true;
    el('#btn-pause').disabled = false;
    stopActiveTimer();
    activeTimer = { intervalId: setInterval(tick, 1000) };
  }
  function pauseTimer(){
    if(!timerState) return;
    timerState.running = false;
    stopActiveTimer();
    var bs = el('#btn-start'), bp = el('#btn-pause');
    if(bs) bs.disabled = false;
    if(bp) bp.disabled = true;
  }

  // ---------- Circuit day wiring ----------
  function circuitSteps(day){
    return buildContinuousSteps(day);
  }
  function refreshCircuitMeta(day){
    var steps = circuitSteps(day);
    var metaEl = el('#mode-meta');
    if(metaEl){
      metaEl.innerHTML = day.rounds + ' rounds \u00B7 <b>' + day.work + 's per move, back-to-back</b> \u00B7 '
        + TRANSITION + 's switch \u00B7 ' + ROUND_REST + 's rest between rounds \u00B7 ~'
        + estimateMinutes(steps) + ' min';
    }
    return steps;
  }
  function attachCircuitHandlers(day){
    initTimer(refreshCircuitMeta(day));

    el('#btn-start').onclick = function(){ ensureAudio(); startTimer(); };
    el('#btn-pause').onclick = function(){ pauseTimer(); };
    el('#btn-next').onclick = function(){ ensureAudio(); advanceStep(); };
    el('#btn-reset').onclick = function(){ pauseTimer(); initTimer(refreshCircuitMeta(day)); };
  }

  function attachEmomHandlers(day){
    initTimer(buildEmomSteps(day));
    el('#btn-start').onclick = function(){ ensureAudio(); startTimer(); };
    el('#btn-pause').onclick = function(){ pauseTimer(); };
    el('#btn-next').onclick = function(){ ensureAudio(); advanceStep(); };
    el('#btn-reset').onclick = function(){ pauseTimer(); initTimer(buildEmomSteps(day)); };
  }

  // ---------- Day 3 complex ----------
  function attachComplexHandlers(day){
    var round = 1;
    var total = day.rounds;
    function renderRoundText(){
      el('#round-text').textContent = round > total ? 'Complex complete' : 'Round ' + round + ' of ' + total;
    }
    function updateComplexDots(){
      var dots = document.querySelectorAll('#round-dots .dot');
      for(var i=0;i<dots.length;i++){
        dots[i].classList.toggle('filled', i < round - 1);
        dots[i].classList.toggle('active', i === round - 1 && round <= total);
      }
    }
    renderRoundText(); updateComplexDots();
    var btnComplete = el('#btn-complete'), btnSkip = el('#btn-skip');
    var restDisplay = el('#rest-display'), restHint = el('#rest-hint'), panel = el('#now-panel');
    function setRest(time, hint, resting){
      restDisplay.textContent = time;
      restHint.textContent = hint;
      panel.classList.toggle('phase-rest', !!resting);
    }

    btnComplete.onclick = function(){
      ensureAudio();
      if(round > total) return;
      beep(1046, 200); vibrate(150);
      round++;
      updateComplexDots();
      renderRoundText();
      if(round > total){
        setRest('Done', 'Nice work', false);
        btnComplete.disabled = true; btnSkip.disabled = true;
        return;
      }
      runCountdown(day.restBetween, function(s){
        if(s > 0) setRest(formatTime(s), 'Rest', true);
        else setRest('Go!', 'Next round', false);
      });
    };
    btnSkip.onclick = function(){ stopActiveTimer(); setRest('Go!', 'Next round', false); };
  }

  // ---------- Cooldown ----------
  function attachStretchHandlers(day){
    day.items.forEach(function(it, i){
      var btn = el('#stretch-btn-' + i);
      var chip = el('#stretch-time-' + i);
      btn.onclick = function(){
        ensureAudio();
        btn.disabled = true;
        runCountdown(30, function(s){ chip.textContent = s > 0 ? formatTime(s) : 'Done'; },
                     function(){ btn.disabled = false; });
      };
    });
  }

  // ---------- Renderers ----------
  function exListHtml(day){
    var html = day.items.map(function(it, i){
      return '<li class="exitem" data-idx="' + i + '">' +
        '<div class="exname">' + esc(it.name) + '</div>' +
        '<div class="exsub">' + esc(it.sub) + '</div>' +
        '<details class="cue"><summary>Cue</summary><p>' + esc(it.cue) + '</p></details>' +
      '</li>';
    }).join('');
    return '<ul class="exlist">' + html + '</ul>';
  }
  function nowPanelHtml(dotCount){
    return '<div class="now-sticky"><div class="now" id="now-panel">' +
        '<div class="now-label" id="now-label">Ready</div>' +
        '<div class="now-time" id="now-time">00:00</div>' +
        '<div class="now-sub" id="now-sub"></div>' +
        '<div class="dots" id="round-dots">' + dotsHtml(dotCount) + '</div>' +
        '<div class="controls">' +
          '<button class="btn btn-primary" id="btn-start">Start</button>' +
          '<button class="btn btn-secondary" id="btn-pause" disabled>Pause</button>' +
          '<button class="btn btn-secondary" id="btn-next">Next ▸</button>' +
          '<button class="btn btn-secondary" id="btn-reset">Reset</button>' +
        '</div>' +
      '</div></div>';
  }
  function renderCircuit(day){
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<div class="info" id="mode-meta"></div>' +
      '<div class="tip">Moves run back-to-back \u2014 the 10s switch is for grabbing the bell, not resting.</div>' +
      nowPanelHtml(day.rounds) +
      exListHtml(day) + '</section>';
  }
  function renderEmom(day){
    var cycleTotal = Math.ceil(day.minutes / day.items.length);
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<div class="info">' + day.minutes + ' min EMOM \u00B7 cycle: ' +
        day.items.map(function(it){ return esc(it.name); }).join(' \u2192 ') + '</div>' +
      '<div class="tip">' + (day.tip ? esc(day.tip) : 'Finish the reps early? That rest is the point \u2014 but if you\u2019re getting 20s+ back every minute, add reps.') + '</div>' +
      nowPanelHtml(cycleTotal) +
      exListHtml(day) + '</section>';
  }
  function renderComplex(day){
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<div class="info"><b>' + esc(day.weight) + '</b> \u00B7 ' + esc(day.reps) + '</div>' +
      '<ol class="seqlist">' + day.sequence.map(function(s, i){
        return '<li class="seqitem"><span class="seqnum">' + (i+1) + '.</span><span><b>' +
          esc(s.name) + '</b>' + (s.reps ? ' \u2014 <b>' + esc(s.reps) + '</b>' : '') +
          ' \u2014 ' + esc(s.cue) + '</span></li>';
      }).join('') + '</ol>' +
      '<div class="now-sticky"><div class="now" id="now-panel">' +
        '<div class="now-label" id="round-text">Round 1 of ' + day.rounds + '</div>' +
        '<div class="now-time" id="rest-display">' + formatTime(day.restBetween) + '</div>' +
        '<div class="now-sub" id="rest-hint">Rest between rounds</div>' +
        '<div class="dots" id="round-dots">' + dotsHtml(day.rounds) + '</div>' +
        '<div class="controls">' +
          '<button class="btn btn-primary" id="btn-complete">Complete round</button>' +
          '<button class="btn btn-secondary" id="btn-skip">Skip rest</button>' +
        '</div>' +
      '</div></div></section>';
  }
  function renderList(day){
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<ul class="exlist checklist">' + day.items.map(function(it){
        return '<li class="exitem">' +
          '<label class="checkline"><input type="checkbox" /><span class="exname">' + esc(it.name) + '</span></label>' +
          '<div class="exsub">' + esc(it.sub) + '</div>' +
          '<details class="cue"><summary>Cue</summary><p>' + esc(it.cue) + '</p></details>' +
        '</li>';
      }).join('') + '</ul></section>';
  }
  function renderStretch(day){
    return '<section><h1>' + day.title + '</h1><p class="subtitle">' + day.subtitle + '</p>' +
      '<ul class="exlist">' + day.items.map(function(it, i){
        return '<li class="exitem">' +
          '<div class="stretch-row">' +
            '<div><div class="exname">' + esc(it.name) + '</div>' +
            '<div class="exsub">' + esc(it.sub) + '</div></div>' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
              '<span class="timer-chip" id="stretch-time-' + i + '"></span>' +
              '<button class="btn btn-secondary" id="stretch-btn-' + i + '">Start 30s</button>' +
            '</div>' +
          '</div>' +
          '<details class="cue"><summary>Cue</summary><p>' + esc(it.cue) + '</p></details>' +
        '</li>';
      }).join('') + '</ul></section>';
  }

  // ---------- Tabs ----------
  // A day can carry a `before` and/or `after` block (get-ups, Core, a cardio EMOM). Those days get a
  // part switch; only one part is on screen at a time, so every part reuses the same timer and element ids.
  function dayParts(day){
    var parts = [];
    if(day.before) parts.push({ key:'before', label:day.before.title, block:day.before });
    parts.push({ key:'main', label:day.mainLabel || 'Workout', block:day });
    if(day.after) parts.push({ key:'after', label:day.after.title, block:day.after });
    return parts;
  }
  function partSwitchHtml(parts, current){
    return '<div class="parts">' + parts.map(function(p){
      return '<button class="part' + (p.key === current ? ' active' : '') + '" data-part="' + p.key + '">' + esc(p.label) + '</button>';
    }).join('') + '</div>';
  }
  function selectTab(id, part){
    stopActiveTimer();
    timerState = null;
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].dataset.tab === id);
    var day = DAYS.filter(function(d){ return d.id === id; })[0];
    var parts = dayParts(day);
    // default to the first part, so a day with a `before` block opens on it
    var current = parts.filter(function(p){ return p.key === part; })[0] || parts[0];
    var block = current.block;
    var html, attach = null;
    if(block.type === 'list'){ html = renderList(block); }
    else if(block.type === 'stretch'){ html = renderStretch(block); attach = attachStretchHandlers; }
    else if(block.type === 'circuit'){ html = renderCircuit(block); attach = attachCircuitHandlers; }
    else if(block.type === 'emom'){ html = renderEmom(block); attach = attachEmomHandlers; }
    else if(block.type === 'complex'){ html = renderComplex(block); attach = attachComplexHandlers; }
    el('#content').innerHTML = (parts.length > 1 ? partSwitchHtml(parts, current.key) : '') + html;
    if(attach) attach(block);
    if(parts.length > 1){
      var buttons = document.querySelectorAll('.part');
      for(var j=0;j<buttons.length;j++){
        (function(b){ b.addEventListener('click', function(){ selectTab(id, b.dataset.part); }); })(buttons[j]);
      }
    }
    window.scrollTo(0,0);
  }
  function renderTabs(){
    el('#tabs').innerHTML = DAYS.map(function(d){
      return '<button class="tab" data-tab="' + d.id + '">' + d.title + '</button>';
    }).join('');
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      (function(t){ t.addEventListener('click', function(){ selectTab(t.dataset.tab); }); })(tabs[i]);
    }
  }

  // ---------- Programs ----------
  // The chosen program is remembered per device. A ?program=v2 link picks it once, then the
  // parameter is dropped from the address bar so a saved bookmark can't override the picker later.
  var PROGRAM_KEY = 'kb.program';
  function findProgram(id){ return PROGRAMS.filter(function(p){ return p.id === id; })[0]; }
  function initialProgram(){
    var id = null;
    try{
      var params = new URLSearchParams(window.location.search);
      id = params.get('program');
      if(params.has('program')){
        params.delete('program');
        var rest = params.toString();
        window.history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : '') + window.location.hash);
      }
    }catch(e){}
    if(!findProgram(id)){
      try{ id = window.localStorage.getItem(PROGRAM_KEY); }catch(e){ id = null; }
    }
    return findProgram(id) || PROGRAMS[0];
  }
  function workoutInProgress(){
    return !!activeTimer || !!(timerState && (timerState.running || timerState.stepIdx > 0));
  }
  function applyProgram(p){
    program = p;
    DAYS = p.days;
    try{ window.localStorage.setItem(PROGRAM_KEY, p.id); }catch(e){}
    document.documentElement.style.setProperty('--accent', p.accent);
    document.documentElement.style.setProperty('--accent-ink', p.accentInk);
    el('#prog-pill').textContent = p.short;
    renderTabs();
    selectTab(DAYS[0].id);
  }
  function openProgramSheet(){
    el('#sheet-list').innerHTML = PROGRAMS.map(function(p){
      var active = p.id === program.id;
      return '<button class="prog-option' + (active ? ' active' : '') + '" data-program="' + p.id + '"' +
          ' style="--opt-accent:' + p.accent + '">' +
          '<span class="prog-dot"></span>' +
          '<span class="prog-text"><span class="prog-name">' + esc(p.name) + '</span>' +
          '<span class="prog-blurb">' + esc(p.blurb) + '</span></span>' +
          (active ? '<span class="prog-check">✓</span>' : '') +
        '</button>';
    }).join('');
    el('#sheet').hidden = false;
    el('#brand').setAttribute('aria-expanded', 'true');
  }
  function closeProgramSheet(){
    el('#sheet').hidden = true;
    el('#brand').setAttribute('aria-expanded', 'false');
  }
  function chooseProgram(id){
    closeProgramSheet();
    var next = findProgram(id);
    if(!next || next.id === program.id) return;
    if(workoutInProgress() && !window.confirm('Stop your workout and switch to ' + next.name + '?')) return;
    applyProgram(next);
  }

  document.addEventListener('DOMContentLoaded', function(){
    el('#brand').addEventListener('click', openProgramSheet);
    el('#sheet').addEventListener('click', function(e){
      var opt = e.target.closest ? e.target.closest('.prog-option') : null;
      if(opt){ chooseProgram(opt.dataset.program); return; }
      if(e.target === el('#sheet')) closeProgramSheet();
    });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeProgramSheet(); });
    applyProgram(initialProgram());

    function syncTopbarHeight(){
      var tb = document.querySelector('.topbar');
      if(tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
    }
    syncTopbarHeight();
    window.addEventListener('resize', syncTopbarHeight);
    window.addEventListener('orientationchange', syncTopbarHeight);
    if(window.ResizeObserver){
      new ResizeObserver(syncTopbarHeight).observe(document.querySelector('.topbar'));
    }
  });
</script>
</body>
</html>
